[project]
name = "ctb-backend"
version = "0.1.0"
description = "Crypto Trading Brain - Market Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    "apscheduler==3.10.4",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# DexScreener models use camelCase to match the API JSON keys exactly
"app/clients/dexscreener_models.py" = ["N815"]
# SQLAlchemy uses string forward references in relationship() declarations
"app/models/*.py" = ["F821"]
# Base exception naming is intentional (CTBBaseException is a base, not an error type)
"app/core/exceptions.py" = ["N818"]
# Using Generic[T] pattern for broader compatibility
"app/repositories/base.py" = ["UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
